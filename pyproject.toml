[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunein"
dynamic = ["version"]
description = "TuneIn radio api"
dependencies = [
    "requests",
    "mediavocab>=2.0.0a0",
]
license = {text = "Apache-2.0"}
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["TuneIn", "internet radio"]

[project.urls]
Homepage = "https://github.com/LeMetadatarr/tunein"

[project.scripts]
tunein = "tunein.cli:main"

[project.optional-dependencies]
anon = ["anon_requests"]
test = ["pytest", "vcrpy", "pytest-vcr"]
stealth = ["curl-cffi", "unblock_requests"]

[tool.setuptools.dynamic]
version = {attr = "tunein.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
