[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunein"
dynamic = ["version", "dependencies"]
description = "TuneIn radio api"
license = {text = "Apache-2.0"}
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["TuneIn", "internet radio"]

[project.urls]
Homepage = "https://github.com/OpenJarbas/tunein"

[project.scripts]
tunein = "tunein.cli:main"

[tool.setuptools.dynamic]
version = {attr = "tunein.version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
